name: Build & Release NOrange APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex: v1.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-android-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.7"
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --split-per-abi --release

      - name: Prepare NOrange APK artifacts
        run: |
          mkdir -p dist-apks
          cp build/app/outputs/flutter-apk/app-release.apk dist-apks/NOrange-universal-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist-apks/NOrange-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist-apks/NOrange-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist-apks/NOrange-x86_64-release.apk

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: norange-release-apks
          path: dist-apks/*.apk

      - name: Publish GitHub Release (when tag provided)
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "${{ inputs.tag }} - NOrange Release APK"
          make_latest: true
          files: dist-apks/*.apk
