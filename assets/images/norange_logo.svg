<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14161E"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="orangeMain" x1="120" y1="120" x2="392" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9438"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#D94E00"/>
    </linearGradient>
    <linearGradient id="orangeHighlight" x1="256" y1="108" x2="388" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF7714"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="264" y1="54" x2="366" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB86B"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>

  <!-- Minimalist Futuristic Geometric Orange Symbol (NOrange) -->
  <!-- Outer Precision Ring (Rind Silhouette) -->
  <circle cx="256" cy="276" r="164" stroke="url(#orangeMain)" stroke-width="18"/>

  <!-- 6 Geometric Citrus Segments with Structural Channels -->
  <!-- Segment 1: Top-Right (Offset Futuristic Innovation Wedge) -->
  <path d="M 270 254 L 336 140 A 136 136 0 0 1 404 254 Z" fill="url(#orangeHighlight)"/>
  <!-- Segment 2: Bottom-Right -->
  <path d="M 268 284 L 392 284 A 128 128 0 0 1 330 392 Z" fill="url(#orangeMain)"/>
  <!-- Segment 3: Bottom -->
  <path d="M 256 292 L 314 402 A 128 128 0 0 1 198 402 Z" fill="url(#orangeMain)" fill-opacity="0.9"/>
  <!-- Segment 4: Bottom-Left -->
  <path d="M 244 284 L 182 392 A 128 128 0 0 1 120 284 Z" fill="url(#orangeMain)" fill-opacity="0.82"/>
  <!-- Segment 5: Top-Left -->
  <path d="M 244 268 L 120 268 A 128 128 0 0 1 182 160 Z" fill="url(#orangeMain)" fill-opacity="0.9"/>
  <!-- Segment 6: Top -->
  <path d="M 256 260 L 198 150 A 128 128 0 0 1 314 150 Z" fill="url(#orangeHighlight)" fill-opacity="0.95"/>

  <!-- Central Geometric Core Ring -->
  <circle cx="256" cy="276" r="32" fill="#08090C" stroke="#FF8833" stroke-width="6"/>
  <circle cx="256" cy="276" r="10" fill="#FF9E3D"/>

  <!-- Geometric Stem & Futuristic Leaf Vector -->
  <path d="M 256 104 L 256 72" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round"/>
  <path d="M 272 96 C 296 58, 344 52, 376 74 C 348 106, 304 114, 272 96 Z" fill="url(#leafGrad)"/>
